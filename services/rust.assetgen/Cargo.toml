[package]
name = "rust_assetgen"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
poise = { git = "https://github.com/Anti-Raid/poise", branch = "serenity-next" }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", features = [ "runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
indexmap = { version = "2", features = ["serde"] }
dashmap = { version = "6", features = ["serde", "inline", "rayon"] }
async-trait = "0.1.80"

# AntiRaid specific
config = { path = "../../core/rust/rust.config" }
permissions = { path = "../../core/rust/rust.permissions" }
silverpelt = { path = "../../core/rust/rust.silverpelt" }
templating = { path = "../../core/rust/rust.templating" }
templating_docgen = { path = "../../core/rust/rust.templating.docgen" }
bot_modules_default = { path = "../../modules/rust.bot_modules_default" }
bot_binutils = { path = "../../core/rust/rust.binutils" }

[dependencies.tokio]
version = "1"
features = ["sync", "macros", "rt-multi-thread"]

[dependencies.serenity]
git = "https://github.com/Anti-Raid/serenity"
branch = "next"
features = ["model", "http", "cache", "rustls_backend", "unstable"]
